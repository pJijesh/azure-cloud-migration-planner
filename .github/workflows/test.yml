name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Check generated documentation is current
        run: python tools/build_docs.py --check
      - name: Smoke test the quick start
        run: |
          migration-planner plan examples/inventory.csv --assumptions examples/cost-assumptions.json --as-of 2026-11-11 --out /tmp/plan-output
          diff -r /tmp/plan-output examples/output
